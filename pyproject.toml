[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quantum-hamiltonian-analyzer"
version = "0.1.0"
description = "Automated analysis of polynomial bosonic Hamiltonians for Hermiticity and essential self-adjointness."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.9"
authors = [{ name = "FockGuard Contributors" }]
keywords = ["quantum", "hamiltonian", "bosonic", "openfermion", "self-adjoint"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "openfermion>=1.5",
    "sympy>=1.12",
    "numpy>=1.24",
    "scipy>=1.10",
    "qutip>=4.7",
    "pandas>=2.0",
    "matplotlib>=3.7",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "mypy>=1.0"]

[project.scripts]
qha-benchmark = "quantum_hamiltonian_analyzer.benchmark:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["quantum_hamiltonian_analyzer*"]
